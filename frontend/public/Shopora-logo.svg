<svg width="380" height="100" viewBox="0 0 380 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
  .mark-bg {
    fill: #1D9E75;
  }

  .mark-line {
    fill: none;
    stroke: #FFFFFF;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .mark-dot {
    fill: #FFFFFF;
  }

  .wordmark {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 700;
    font-size: 34px;
    fill: var(--wordmark-color);
  }

  .wordmark-accent {
    fill: #1D9E75;
  }

  .tagline {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 1.5px;
    fill: #6B7A75;
  }
</style>
  </defs>

  <!-- Icon: rounded square badge with shopping bag -->
  <rect x="8" y="10" width="80" height="80" rx="20" class="mark-bg"/>

  <!-- Shopping bag body -->
  <path class="mark-line" d="M28 40 H68 L64 74 H32 Z"/>
  <!-- Bag handle -->
  <path class="mark-line" d="M36 40 V32 A12 12 0 0 1 60 32 V40"/>
  <!-- Check mark inside bag -->
  <path class="mark-line" d="M40 56 L47 63 L58 50"/>

  <!-- Wordmark -->
  <text x="98" y="52" class="wordmark">Shop<tspan class="wordmark-accent">ora</tspan></text>
  <text x="99" y="70" class="tagline">ONLINE STORE</text>
</svg>